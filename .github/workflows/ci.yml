name: CI

on:
  push:
    branches:
      - main
      - login
      - service
      - teste
      - polish
  pull_request:
    branches:
      - main
      - login

jobs:
  django-tests:
    name: Django tests
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      USE_LOCAL_SQLITE: "True"
      USE_CLOUDINARY: "False"
      TWILIO_SMS_ENABLED: "False"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4.1-mini

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run automated test suite
        run: python manage.py test accounts bookings core invoices services.test_business_logic services.test_permissions_and_public services.test_api_endpoints --verbosity 2
