<section class="dc-table-wrap" id="actiuni-rapide">
  <div class="dc-panel-head mb-3"><div><h2 class="h4 mb-1">Acțiuni rapide</h2><p class="text-muted-custom mb-0">Cele mai folosite operațiuni, grupate într-un singur loc.</p></div></div>
  <div class="dc-action-grid">
    {% for action in dashboard.quick_actions %}
      <a class="dc-action" href="{{ action.url }}">
        <div class="dc-icon"><i class="bi {{ action.icon }}"></i></div>
        <div>
          <strong>{{ action.title }}</strong>
          <small class="d-block mt-2">Deschide imediat zona relevantă din platformă.</small>
        </div>
      </a>
    {% endfor %}
  </div>
</section>
