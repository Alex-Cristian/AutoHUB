<section class="rp-chart">
  <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-end mb-3">
    <div>
      <h2 class="h3 mb-1">{{ report.title }}</h2>
      <div class="text-muted-custom">Perioadă selectată: {{ report.period.label }}</div>
    </div>
    {% if report.highlights %}
      <div class="text-muted-custom small text-lg-end">
        {% for item in report.highlights|slice:':3' %}<div>{{ item }}</div>{% endfor %}
      </div>
    {% endif %}
  </div>
  <div class="rp-summary mb-4">
    {% for item in report.summary %}
      <div class="rp-card">
        <div class="d-flex justify-content-between gap-3"><div><div class="rp-label">{{ item.label }}</div><div class="rp-value">{{ item.value }}</div></div><div class="dc-icon"><i class="bi {{ item.icon }}"></i></div></div>
      </div>
    {% endfor %}
  </div>
  <div style="height:320px"><canvas id="reportChart"></canvas></div>
</section>
