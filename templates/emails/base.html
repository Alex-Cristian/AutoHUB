<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{ brand_name }}</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
    img { -ms-interpolation-mode:bicubic; border:0; height:auto; line-height:100%; outline:none; text-decoration:none; }
    table { border-collapse:collapse !important; }
    body { margin:0 !important; padding:0 !important; width:100% !important; height:100% !important; background:#f3f4f6; }
    a { color:#d92d3a; text-decoration:none; }
    @media screen and (max-width: 640px) {
      .container { width:100% !important; }
      .stack { display:block !important; width:100% !important; }
      .mobile-pad { padding-left:20px !important; padding-right:20px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
    {{ preview_text|default:headline }}
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f4f6;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="container" style="max-width:640px;">
          <tr>
            <td align="center" style="padding:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#6b7280;">
              <span style="display:inline-block;padding:8px 14px;border-radius:999px;background:#111827;color:#ffffff;font-weight:700;letter-spacing:.04em;">
                Auto<span style="color:#ff6b57;">EMG</span>
              </span>
            </td>
          </tr>
          <tr>
            <td style="background:#111827;border-radius:24px;overflow:hidden;box-shadow:0 20px 45px rgba(17,24,39,.16);">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding:28px 32px;background:linear-gradient(135deg,#111827 0%,#1f2937 60%,#2f1317 100%);" class="mobile-pad">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td class="stack" style="font-family:Arial,Helvetica,sans-serif;color:#ffffff;">
                          <div style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#fca5a5;font-weight:700;margin-bottom:12px;">
                            {{ brand_tagline }}
                          </div>
                          <h1 style="margin:0;font-size:34px;line-height:1.1;font-weight:800;">{{ headline }}</h1>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:32px;background:#ffffff;" class="mobile-pad">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.7;color:#1f2937;">
                          {% block email_body %}{% endblock %}
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:20px 32px;background:#f9fafb;border-top:1px solid #e5e7eb;" class="mobile-pad">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#6b7280;">
                          AutoEMG te ajuta sa gestionezi programari, oferte si statusuri de service intr-un singur loc.
                        </td>
                      </tr>
                      <tr>
                        <td style="padding-top:10px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#9ca3af;">
                          Platforma: <a href="{{ site_url }}" style="color:#d92d3a;">{{ site_url }}</a>
                          {% if support_email %}<br>Contact: {{ support_email }}{% endif %}
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
