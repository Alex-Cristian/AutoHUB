databases:
  - name: autohub-db
    databaseName: autohub
    user: autohub

services:
  - type: web
    name: autohub
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn autohub.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: autohub-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: autoemg.com,www.autoemg.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://autoemg.com,https://www.autoemg.com
      - key: SITE_BASE_URL
        value: https://www.autoemg.com
      - key: USE_CLOUDINARY
        value: True
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: cron
    name: autohub-booking-reminders
    runtime: python
    schedule: "0 9 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_booking_reminders
    envVars:
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: autohub
          envVarKey: DJANGO_SECRET_KEY
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: autohub-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: autoemg.com,www.autoemg.com
      - key: SITE_BASE_URL
        value: https://www.autoemg.com
      - key: USE_CLOUDINARY
        value: True
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_SMS_ENABLED
        value: True
